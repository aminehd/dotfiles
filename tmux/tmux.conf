# --- General Settings ---
# Set default terminal mode to 256 colors
set -g default-terminal "screen-256color"
# Fix colors for modern terminals (e.g., Alacritty, Kitty)
set-option -sa terminal-overrides ",xterm-256color:RGB"
# Tell apps inside tmux (opencode, nvim) that 24-bit colour works,
# otherwise their themes fall back to washed-out 256 colours.
set-option -sa terminal-features ",xterm-256color:RGB"
set-environment -g COLORTERM truecolor

# Enable mouse support
set -g mouse on

# Increase history limit
set -g history-limit 100000

# Zero-out escape time delay (for Vim/Neovim users)
set -sg escape-time 0

# Start window and pane numbering at 1 (easier to reach)
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Use Vi keys in copy mode
setw -g mode-keys vi


# --- Key Bindings ---

# Reload config file
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Split windows using \ and - (and open in current path)
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Moving between panes with Vim movement keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy mode bindings (Vi style)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel


# --- Status Bar & Visuals ---

# Status bar position
set -g status-position bottom

# Status bar colors (Dark gray background, light text)
set -g status-style bg=colour235,fg=colour250

# Active window style (highlighted)
setw -g window-status-current-style bg=colour237,fg=colour220,bold
setw -g window-status-current-format " #I:#W "

# Inactive window style
setw -g window-status-style bg=colour235,fg=colour244
setw -g window-status-format " #I:#W "

# Pane borders
set -g pane-border-style fg=colour235
set -g pane-active-border-style fg=colour39

# Message style (e.g., command prompt)
set -g message-style bg=colour235,fg=colour220

# Mode style (e.g., copy mode selection)
set -g mode-style bg=colour236,fg=colour220

# Clock mode
setw -g clock-mode-colour colour39
setw -g clock-mode-style 24

# Status Left (Session name)
set -g status-left-length 40
set -g status-left "#[fg=colour39,bg=colour235,bold] #S #[default]"

# Status Right (Date & Time)
set -g status-right-length 150
set -g status-right "#[fg=colour39,bg=colour235] %Y-%m-%d #[fg=colour39,bg=colour235] %H:%M "
# ── session save/restore (tmux-resurrect + continuum) ──────────────────
set -g @resurrect-dir '~/.config/tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'      # restore what was on screen
set -g @resurrect-processes '"nvim" "vim" "lazygit" "htop" "btop"'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-save-interval '15'              # auto-save every 15 min
set -g @continuum-restore 'off'               

# fast fuzzy jump (rs): prefix + j -> fzf across all windows, switch on enter
bind-key j display-popup -E "tmux list-windows -a -F '#{session_name}:#{window_index} #{window_name}' | fzf --reverse --prompt='jump> ' | awk '{print \$1}' | xargs -r tmux switch-client -t"
bind-key J choose-tree -Zw   # fallback jump (built-in, no fzf)

# --------------------------------------------------------------------------
# Plugins, installed by tpm (prefix + I to install, prefix + U to update)
# --------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
run '~/.config/tmux/plugins/tpm/tpm'
